# ============================================================
# 前端仓库编排文件
#
# 仓库位置：仓库根目录 docker-compose.yml
# 部署位置：/opt/check-repeat-frontend/docker-compose.yml
#
# ⚠️ 必须位于【仓库根目录】，不能挪进 deploy/
#
# deploy/ 放的是「需要安装到系统其它路径」的制品（网关配置、部署脚本等），
# 本文件不属于那一类：它就是前端检出目录自己的编排，随 git checkout 一起到位。
#
# 而且它依赖这个位置：下面 build.context 是 "."，而 compose 文件中相对路径
# 以【本文件所在目录】为基准解析。文件若在 deploy/ 下，context 会变成 deploy/
# 子目录 —— 那里没有 Dockerfile，构建直接失败。
# 部署脚本按 $APP_DIR/docker-compose.yml 读取它，手册里的手动命令
# （cd /opt/check-repeat-frontend && docker compose ...）也都不带 -f，
# 同样假定它在检出目录根。
#
# 本文件【只包含 frontend 一个服务】，是四份独立编排之一：
#     /opt/check-repeat/docker-compose.yml            中间件（mysql/redis/minio/kkfileview）
#     /usr/local/check-repeat/docker-compose.prod.yml 后端（check-repeat-service 仓库的制品）
#     /opt/check-repeat/nginx/docker-compose.yml      网关（由 deploy/gateway-compose.yml 安装）
#     /opt/check-repeat-frontend/docker-compose.yml   前端（本文件）
# 四方各自独立维护、独立部署，任何一方 compose down 都不影响其余三方。
#
# ⚠️ 注意后端【不在】/opt/check-repeat/ 下：那个目录的 compose 是中间件。
#    历史上后端确实在那里（本仓库 deploy/README.md 第二节的迁移叙述仍是那个布局），
#    后来迁到了 /usr/local/check-repeat/，别混用 -f。
#
# 前端容器不需要访问后端（请求转发全由网关负责），
# 它唯一需要互通的对象是网关。
# ============================================================

# 固定项目名，避免依赖目录名（目录改名不会导致资源被视作另一个项目）
name: check-repeat-frontend


services:
  frontend:
    # tag 由部署脚本按 commit 短 SHA 注入，使每次发布的镜像可追溯、可回滚。
    # 直接 docker compose up 而未设该变量时退化为 latest。
    image: check-repeat-frontend:${FRONTEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: check-repeat-frontend
    restart: unless-stopped

    # 只声明内部端口，不发布到宿主机。
    # 对外流量一律经 gateway 容器进入，前端端口不暴露。
    expose:
      - "80"

    healthcheck:
      # 必须写 127.0.0.1，不能写 localhost。
      # Docker 会给容器写入 "::1 localhost"，BusyBox wget 解析 localhost 时取到
      # IPv6 的 ::1，而 nginx 的 listen 80; 只绑 IPv4 -> Connection refused。
      # BusyBox wget 不会回退到下一个地址，健康检查因此永远失败，
      # 进而让部署脚本判定发布失败并自动回滚。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

networks:
  app-network:
    # 该网络由基础设施侧【手动创建一次】(docker network create)，
    # 三方均以此形式引用。不归属任何 compose 项目，
    # 因此不会被谁的 docker compose down 连带删除。
    name: check-repeat_app-network
    external: true
