# ============================================================
# 网关 Nginx 配置（部署到宿主机 /opt/check-repeat/nginx/conf/nginx.conf）
#
# 与改造前的区别：
#   1. location /     由「容器内静态文件」改为「反代到 frontend 容器」
#   2. ACME 验证路径  由容器内 /usr/share/nginx/html 改为宿主机挂载的
#                     /var/www/certbot，使 certbot 真正能完成续期
#   3. 引入 /etc/nginx/jenkins.d/*.conf，把「入口」与「Jenkins 子域」
#      拆成两个文件，各自独立启用
#   4. 新增 location /minio/，把容器网络内的 MinIO 暴露给浏览器读对象
#      （头像用）。后端配置项 MINIO_PUBLIC_ENDPOINT 必须与之对应。
#
# ⚠️ 为什么 Jenkins 子域不写在本文件里
#   Jenkins 的 server 块引用 jenkins 子域证书。而该证书只能用 webroot 方式
#   签发，签发又要求本网关已经在提供 /var/www/certbot —— 即：
#       配置里写死证书  →  证书还不存在  →  nginx 拒绝启动  →  整站挂掉
#       先签证书        →  ACME 无人应答  →  签发失败
#   两者互为前置，是个死锁。
#   拆成独立 include 后，启用顺序就变成单向的：
#       阶段一：只部署本文件（不含 Jenkins）→ 网关起来 → ACME 通道打通
#       阶段二：签发证书 → 再放入 Jenkins 片段 → reload
#
# 保留未动的正确设计：安全响应头、API 限流、/ws/ 的 WS 升级与长超时
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript
               application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1000;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # WebSocket 升级判断（供 /ws/ 与 Jenkins server 块使用）。
    # 必须定义在 http 块内且位于使用它的 server 块之前。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 默认不透传上游 Connection 头，保持长连接复用；
    # /ws/ 与 Jenkins 的 location 内会各自覆盖为 upgrade。
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ===== HTTP：ACME 验证 + 跳转 HTTPS =====
    # jenkins 子域在此显式列出（而不是靠「默认 server」兜底）：
    # Let's Encrypt 的 HTTP-01 校验请求会带 Host: jenkins.check-repeat-system.xyz，
    # 显式声明后行为确定，且 301 跳转会带上正确域名。
    server {
        listen 80;
        listen [::]:80;
        server_name check-repeat-system.xyz www.check-repeat-system.xyz
                    jenkins.check-repeat-system.xyz;

        # 容器健康检查探针。
        # 精确匹配（=）优先级高于前缀匹配，因此不会被下面的 301 跳转吃掉；
        # 否则健康检查会试图在 localhost 上做 TLS 握手，因证书域名不匹配而永远失败。
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 关键改动：走宿主机挂载的 webroot，certbot 才能写入验证文件
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== HTTPS 主服务 =====
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name check-repeat-system.xyz www.check-repeat-system.xyz;

        ssl_certificate     /etc/letsencrypt/live/check-repeat-system.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/check-repeat-system.xyz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        access_log  /var/log/nginx/access.log;
        error_log   /var/log/nginx/error.log;

        # ---------- 前端静态资源：反代到 frontend 容器 ----------
        # 缓存策略与 SPA 回退由 frontend 容器自己的 Nginx 负责，
        # 网关只做透明转发，不在此处重复配置，避免两处策略打架。
        #
        # 为什么用变量而不是字面主机名：
        #   frontend 属于【另一个 compose 项目】，两边启动顺序无法保证。
        #   若写死 proxy_pass http://frontend:80，当 frontend 尚未就绪时
        #   nginx 会因 "host not found in upstream" 直接拒绝启动 ——
        #   主机重启后若网关先起，整站会挂死。
        #   改成变量后，解析被推迟到运行时，并借 Docker 内置 DNS 定期重解析，
        #   前端容器重建或重启后网关能自动恢复。
        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $frontend_upstream http://frontend:80;

            proxy_pass $frontend_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- 后端接口 ----------
        #
        # 上游写成【变量】，把域名解析推迟到运行时，由 Docker 内置 DNS 每 10s
        # 重解析一次 —— 与上面 location / 同一手法。
        #
        # 为什么必须这样：写【字面主机名】时，nginx 在【加载配置时】解析一次就固定。
        # 后端容器一旦重建就会拿到新 IP，网关却仍往旧 IP 发请求 → /check/ 全线 502
        # （页面能打开、所有接口都挂），且只有人工 reload 才能恢复。
        # 这不是假设：2026-09-27 后端把容器从 check-repeat-app 改名为 check-backend
        # 时就是这样挂的，旧 IP 还被回收给了前端容器，表现成"请求打到了前端"。
        # 改成变量后，后端换 IP、甚至改名重建，网关都会自动跟上。
        #
        # 变量形式下 proxy_pass 不带 URI，nginx 把【原始 URI】原样转发；
        # 这里原 URI 就是 /check/...，与后端 context-path 一致，故无需 rewrite。
        location /check/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend_upstream http://check-backend:8080;

            proxy_pass $backend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_connect_timeout 30s;
            # 查重为长耗时任务（前端 axios 超时 120s），此处放宽
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 200M;
        }

        # ---------- WebSocket（实时查重进度）----------
        # 上游来源同上（$backend_upstream 在同一 server 块内定义）。
        #
        # ⚠️ 变量写法【不会】自动补 URI 前缀，必须显式改写，两处差异：
        #     字面 proxy_pass http://check-backend:8080/check/ws/;
        #       proxy_pass 带 URI 时，nginx 用该 URI 替换 location 匹配的那段，
        #       于是 /ws/abc → /check/ws/abc
        #     变量 proxy_pass $backend_upstream;
        #       只把原始 URI 原样送出，即 /ws/abc —— 后端没有这个路径，会 404
        #   因此这里加一条 rewrite 把前缀补回去。
        location /ws/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend_upstream http://check-backend:8080;

            rewrite ^/ws/(.*)$ /check/ws/$1 break;

            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 长连接，超时给足
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # SockJS 降级到 XHR-streaming 时，缓冲会导致消息不实时，必须关闭
            proxy_buffering off;
        }

        # ---------- MinIO 对象读取（头像等，给浏览器直连）----------
        #
        # 为什么需要这一段：MinIO 只发布在容器网络内，后端拿到的地址是网络别名
        # http://minio:9000 —— 浏览器不在那张网络里，解析不了这个主机名。
        # 而后端存进 sys_user.avatar 的 URL 是给 <img src> 用的（前端
        # userStore.avatarSrc 直接绑定），必须是公网可达的地址，故由网关代一段。
        #
        # ⚠️ 两处必须一致：
        #     本 location 的前缀 /minio/
        #     后端环境变量 MINIO_PUBLIC_ENDPOINT=https://check-repeat-system.xyz/minio
        #   后端拼 URL 是 publicEndpoint + "/" + bucket + "/" + 对象名，
        #   故最终请求形如 /minio/avatar/avatar/<userId>/<uuid>.jpeg，
        #   改写后送到 MinIO 的是 /avatar/avatar/<userId>/<uuid>.jpeg
        #   （第一段是桶名，其余是对象名，与 InfoServiceImpl 的 key 拼接对应）。
        #
        # 上游同样写成【变量】：minio 容器重建会换 IP，字面主机名会让网关一直
        # 往旧 IP 发请求（与 /check/ 同一个坑，见上方注释）。
        #
        # ⚠️ 变量形式下 proxy_pass 不带 URI、也不会自动剥掉前缀，必须显式 rewrite。
        #   否则 /minio/avatar/a.jpg 被原样送进 MinIO —— MinIO 没有 /minio/ 这个
        #   路径，会当成「桶名叫 minio」，返回 NoSuchBucket。（与 /ws/ 同理）
        location /minio/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $minio_upstream http://minio:9000;

            rewrite ^/minio/(.*)$ /$1 break;

            proxy_pass $minio_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 这条路径只用于「浏览器读对象」，后端自己读写 MinIO 走的是容器网络内的
            # 直连（minio.endpoint），不经这里。因此把写方法全挡掉，万一副本桶策略
            # 配错也不会被公网改写对象。
            limit_except GET HEAD {
                deny all;
            }
        }

        # ---------- kkFileView 在线预览（office 文档转 HTML）----------
        #
        # 为什么需要这一段：kkFileView 只在容器网络内（http://kkfileview:8012），
        # 后端 smartPreview 对 office 文档 302 到该内网地址 —— 浏览器既解析不了
        # docker 服务名，HTTPS 页面也不允许发起 HTTP 子请求（Mixed Content）。
        # 由网关代理到同源 HTTPS 路径下，两个问题一并消除。
        #
        # ⚠️ 三处必须一致（改一处不改其余即坏）：
        #     ① 本 location 前缀 /kkfileview/
        #     ② 后端生成 302 跳转地址用的 kkfileview base-url
        #        必须由 http://kkfileview:8012 改为
        #        https://check-repeat-system.xyz/kkfileview
        #     ③ kkFileView 自身配置 base.url=https://check-repeat-system.xyz/kkfileview
        #        —— 预览页内的 JS/CSS/图片等绝对路径资源链接按 base.url 生成，
        #        不配则页面能打开、样式脚本全部 404。
        #
        # 上游写成变量，理由同 /check/（容器重建换 IP 后字面主机名会让网关 502）。
        # 变量形式下 proxy_pass 不带 URI、不自动剥前缀，必须显式 rewrite。
        location /kkfileview/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $kkfileview_upstream http://kkfileview:8012;

            rewrite ^/kkfileview/(.*)$ /$1 break;

            proxy_pass $kkfileview_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # office 转图/转 PDF 为长耗时操作，与 /check/ 同档放宽
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ============================================================
    # Jenkins 子域（可选，阶段二启用）
    #
    # 内容放在独立文件中，本行把它挂进来：
    #     /opt/check-repeat/nginx/conf/jenkins.d/10-jenkins.conf
    #
    # 目录初始只有 00-placeholder.conf（纯注释），因此这里的通配
    # 永远至少匹配到一个文件，且不含任何 server 块 —— 网关可正常启动。
    #
    # 启用步骤见 deploy/README.md「一、签发 Jenkins 子域证书」。
    # 若改用「根域名 + /jenkins/ 路径前缀」方案，则本行与 jenkins.d
    # 整个目录都不需要，改为给 Jenkins 容器加 JENKINS_OPTS="--prefix=/jenkins" 重建。
    # ============================================================
    include /etc/nginx/jenkins.d/*.conf;
}
