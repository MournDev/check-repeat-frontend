# ============================================================
# 本目录由网关主配置 include：
#     /opt/check-repeat/nginx/conf/nginx.conf
#         └── include /etc/nginx/jenkins.d/*.conf;
#
# 这个占位文件的唯一作用：保证上面那条通配 include 至少匹配到一个
# 文件，从而不依赖「nginx 对空通配是否报错」这一行为差异。
# 它只有注释，不产生任何 server 块，对网关行为零影响。请勿删除。
#
# 启用 Jenkins 子域时，把 deploy/nginx-jenkins.conf 复制进来并改名：
#     install -m 0644 /opt/check-repeat-frontend/deploy/nginx-jenkins.conf \
#         /opt/check-repeat/nginx/conf/jenkins.d/10-jenkins.conf
#
# ⚠️ 复制前必须先确认证书已签发成功：
#     ls /etc/letsencrypt/live/jenkins.check-repeat-system.xyz/fullchain.pem
#   该文件不存在时放入 10-jenkins.conf，nginx 会拒绝启动，整站不可用。
#
# 回退（Jenkins 子域出问题需紧急恢复主站）：
#     rm /opt/check-repeat/nginx/conf/jenkins.d/10-jenkins.conf
#     docker exec check-repeat-gateway nginx -t && \
#         docker exec check-repeat-gateway nginx -s reload
# ============================================================
