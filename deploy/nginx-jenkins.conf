# ============================================================
# Jenkins 子域 server 块
#
# 部署位置：/opt/check-repeat/nginx/conf/jenkins.d/10-jenkins.conf
# 由网关主配置以 include /etc/nginx/jenkins.d/*.conf; 引入，
# 因此本文件是 http 块级别的片段，【不要】再包 events{} / http{}。
#
# ⚠️ 放入前必须已签发证书，否则网关拒绝启动、整站不可用：
#     ls /etc/letsencrypt/live/jenkins.check-repeat-system.xyz/fullchain.pem
#
# 前置条件（缺一不可）：
#   a) DNS A 记录 jenkins.check-repeat-system.xyz -> 本机公网 IP
#   b) 该子域证书已签发（签发命令见 deploy/README.md 一.5）
#   c) Jenkins 容器已接入 check-repeat_app-network 且别名为 jenkins：
#        docker network connect --alias jenkins check-repeat_app-network jenkins
#      缺这步【不会】让 nginx 拒绝启动（上游是变量，运行时才解析），
#      表现为访问子域返回 502。用下面这条判断：
#        docker exec check-repeat-gateway getent hosts jenkins
#      注意 network connect 是运行时操作，Jenkins 容器重建后必须重新执行。
#
# 若改用「根域名 + /jenkins/ 路径前缀」方案，删除本文件，
# 并给 Jenkins 容器加 JENKINS_OPTS="--prefix=/jenkins" 重建。
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jenkins.check-repeat-system.xyz;

    ssl_certificate     /etc/letsencrypt/live/jenkins.check-repeat-system.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.check-repeat-system.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Jenkins 可上传插件与构建产物，默认 1M 会拦下来
    client_max_body_size 100M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------
    # Webhook 回调路径：必须始终放开，否则 Gitee 推送无法触发构建。
    # 放在 location / 之前不影响匹配（nginx 取最长前缀），
    # 单独写出来是为了让它不受下面 allow/deny 白名单的影响。
    # 鉴权由 URL 里的 token 承担（见 README 六）。
    # ------------------------------------------------------------
    location /generic-webhook-trigger/ {
        # 上游写法同 location /（见下）
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jenkins_upstream http://jenkins:8080;

        proxy_pass $jenkins_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------
    # Jenkins 管理界面
    #
    # 生产加固：【默认完全不对公网开放】。UI 只能经 SSH 隧道访问：
    #     ssh -L 8080:127.0.0.1:8081 root@<服务器>
    #   注意这里必须是 127.0.0.1，不能写 172.17.0.1：
    #   Jenkins 容器 `docker port` 显示 8080/tcp -> 127.0.0.1:8081，只监听
    #   宿主机 loopback，172.17.0.1:8081 上没有任何东西在监听。
    #   （别与 Jenkinsfile 的 DEPLOY_HOST=172.17.0.1 混淆 —— 那是反方向：
    #     Jenkins 容器【主动连出】到宿主机，走 docker0 网关，与隧道无关。）
    #   然后浏览器打开 http://localhost:8080
    #   （隧道直连宿主机的 8081，根本不经过本 server 块）
    #
    # 为什么默认是 deny all 而不是「靠 Jenkins 登录认证挡着」：
    #   证书一经签发，域名就写入了 Certificate Transparency 日志，
    #   而 CT 日志是公开且被实时监控的 —— 等于把子域公告了出去。
    #   实测：本子域启用后一分钟内，日志里就出现了 LeakIX 扫描器
    #   探测 /.env、/.DS_Store、/v2/_catalog 这类高价值路径。
    #   Jenkins 的登录页长期暴露在公网并不划算。
    #
    # 若确实需要直接从公网访问 UI，把 deny all 换成：
    #     allow <你的运维出口 IP>;
    #     deny  all;
    #   （多个 IP 就写多行 allow。出口是家宽动态 IP 时慎用 —— 换 IP 后
    #     你自己也会被挡在外面，那时仍应回退到 SSH 隧道。）
    # ------------------------------------------------------------
    location / {
        deny all;

        # 上游写成【变量】而非字面主机名。
        #
        # Jenkins 容器一旦被重建（升级、改启动参数重跑）就会拿到新 IP。
        # 字面主机名在 nginx【加载配置时】解析一次就固定，之后一直打旧 IP：
        #   - UI 打不开
        #   - 更隐蔽的是 /generic-webhook-trigger/ 也会 502，
        #     表现为「push 了但 Jenkins 没反应」，且不会有任何报错提示
        # 变量写法由 Docker 内置 DNS 每 10s 重解析，容器换 IP 后自动跟上。
        #
        # 注意：docker network connect 是运行时操作，容器重建后需重新执行；
        # 别名不存在时这里会 502（不是启动失败），判断方法见文件头 c)。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jenkins_upstream http://jenkins:8080;

        proxy_pass $jenkins_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jenkins 的实时控制台日志走 WebSocket（缺这两行日志不会动）
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        # 反代后让 Jenkins 生成 https 链接，避免重定向回 http 造成混合内容
        proxy_redirect http:// https://;
    }
}
