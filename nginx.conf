# ========================================
# 前端容器内 Nginx 配置
#
# 职责：【仅托管 Vite 构建产物】——纯静态文件 + SPA history 回退
#
# ⚠️ 此处【不要】配置后端代理。
# 前后端已拆分独立部署，`/check/` 由【宿主机 Nginx】直接转发到后端服务，
# 请求根本不会到达本容器。若在此处也配代理，将造成双重代理，
# 且 `backend` 这类主机名在单容器运行时并不存在，会返回 502。
# ========================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA history 模式：未命中静态文件时一律回退到 index.html，
    # 使前端路由（/student/xxx 等）刷新后仍能正常打开。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物文件名带内容 hash，内容变化即换名，可安全长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不缓存：它是资源清单，发版后必须让用户立即拿到新引用，
    # 否则会出现旧的 index 指向已被删除的 hash 资源而白屏。
    # 精确匹配优先级高于 `location /`，会覆盖上面的回退规则。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
}
